<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proponer canción - Cancionero Litúrgico</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1f2937;font-family:Arial,sans-serif}main{max-width:760px;margin:24px auto;padding:14px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 3px 14px #0001}label{font-weight:700;display:block;margin-top:12px}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin-top:5px}textarea{min-height:250px;resize:vertical}.momentos{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:8px}.momento{padding:8px;background:#f8fafc;border-radius:7px}.momento input{width:auto;margin:0 6px 0 0}button{padding:11px 15px;border:0;border-radius:7px;font-weight:700;cursor:pointer;margin-top:14px}.primary{background:#1565c0;color:#fff}.secondary{background:#e5e7eb}.ok{color:#15803d}.bad{color:#b91c1c}.hidden{display:none}pre{white-space:pre-wrap;background:#111827;color:#eee;padding:12px;border-radius:8px}</style></head><body><main>
<section class="card"><h1>Proponer canción</h1><p>Las propuestas se guardan como <b>PENDIENTE</b> y no aparecen en el catálogo público hasta que un administrador las apruebe.</p><p id="sesion">Comprobando sesión…</p></section>
<section class="card hidden" id="loginBox"><h2>Iniciar sesión</h2><label>Correo<input id="email" type="email"></label><label>Contraseña<input id="password" type="password"></label><button class="primary" id="login">Entrar</button></section>
<section class="card hidden" id="formBox"><label>Título *<input id="titulo"></label><label>Autor<input id="autor"></label><label>Momentos litúrgicos *</label><div class="momentos" id="momentos"></div><label>Letra *<textarea id="letra"></textarea></label><label>Tono (opcional)<input id="tono"></label><button class="primary" id="guardar">Enviar propuesta</button> <button class="secondary" id="logout">Cerrar sesión</button><p id="resultado"></p></section>
<section class="card"><h2>Diagnóstico</h2><pre id="log">Inicializando…</pre></section>
</main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDsgYJ3OGJ2JQfXX9l2CO-V26-v90sKFAY",authDomain:"cancionerodominico.firebaseapp.com",projectId:"cancionerodominico",storageBucket:"cancionerodominico.firebasestorage.app",messagingSenderId:"1019835999965",appId:"1:1019835999965:web:4a30265a4d1cc69ba65d34",measurementId:"G-2DE8QCPQ1B"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let perfil=null;const cats=["Entrada","Perdon","Gloria","Antifona","Colecta","Ofertorio","Santo","Padre","Cordero","Comunion","ComunionII","Salida","Himno"];
$('momentos').innerHTML=cats.map(c=>`<label class="momento"><input type="checkbox" value="${c}">${c}</label>`).join('');function log(t){$('log').textContent=t}function limpiar(){['titulo','autor','letra','tono'].forEach(x=>$(x).value='');document.querySelectorAll('#momentos input').forEach(x=>x.checked=false)}
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){log((e.code||'ERROR')+': '+e.message)}};$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{perfil=null;if(!u){$('sesion').textContent='Necesitas iniciar sesión como COLABORADOR o ADMINISTRADOR para proponer.';$('loginBox').classList.remove('hidden');$('formBox').classList.add('hidden');log('Sin sesión activa.');return}try{const s=await getDoc(doc(db,'usuarios',u.uid));if(!s.exists())throw Error('Perfil no encontrado');const p=s.data();if(p.activo!==true||!['COLABORADOR','ADMINISTRADOR'].includes(p.rol))throw Error('Usuario sin permiso para proponer');perfil={uid:u.uid,email:u.email,nombre:p.nombre||'',rol:p.rol};$('sesion').innerHTML=`✓ ${perfil.nombre||perfil.email} · <b>${perfil.rol}</b>`;$('loginBox').classList.add('hidden');$('formBox').classList.remove('hidden');log('✓ Authentication\n✓ Perfil válido\n✓ Puede proponer canciones')}catch(e){$('formBox').classList.add('hidden');log('ERROR: '+e.message)}});
$('guardar').onclick=async()=>{if(!perfil)return;const titulo=$('titulo').value.trim(),autor=$('autor').value.trim(),letra=$('letra').value.trim(),tono=$('tono').value.trim(),momentos=[...document.querySelectorAll('#momentos input:checked')].map(x=>x.value);if(!titulo||!letra||!momentos.length){$('resultado').innerHTML='<span class="bad">Completa título, letra y al menos un momento litúrgico.</span>';return}const id=crypto.randomUUID();const data={id,titulo,autor,momentos,letra,tono,acordes:'',estado:'PENDIENTE',activo:true,creadoPor:perfil.uid,creadoPorNombre:perfil.nombre||'',creadoPorEmail:perfil.email||'',creadoAt:serverTimestamp(),actualizadoAt:serverTimestamp()};$('guardar').disabled=true;$('resultado').textContent='Guardando propuesta…';try{await setDoc(doc(db,'canciones',id),data);$('resultado').innerHTML='<span class="ok">✓ Propuesta enviada. Quedó PENDIENTE de revisión.</span>';log(`✓ Guardada canciones/${id}\n✓ estado: PENDIENTE\n✓ creadoPor: ${perfil.uid}`);limpiar()}catch(e){$('resultado').innerHTML='<span class="bad">✗ No se pudo guardar.</span>';log((e.code||'ERROR')+': '+e.message)}finally{$('guardar').disabled=false}};
</script></body></html>
