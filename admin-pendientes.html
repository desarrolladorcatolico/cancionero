<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar propuestas</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}main{max-width:900px;margin:24px auto;padding:14px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0001}input,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin:5px 0}textarea{min-height:180px}button{padding:10px 13px;border:0;border-radius:7px;font-weight:bold;margin:6px 5px 0 0;cursor:pointer}.ok{background:#15803d;color:#fff}.bad{background:#b91c1c;color:#fff}.blue{background:#1565c0;color:white}.hidden{display:none}.item{border:1px solid #e2e8f0;border-radius:10px;padding:15px;margin-top:12px}.muted{color:#64748b}pre{white-space:pre-wrap;background:#111827;color:#eee;padding:12px;border-radius:8px}</style></head><body><main>
<section class="card"><h1>Propuestas pendientes</h1><p id="sesion">Comprobando administrador…</p></section>
<section id="loginBox" class="card hidden"><label>Correo<input id="email" type="email"></label><label>Contraseña<input id="password" type="password"></label><button id="login" class="blue">Entrar</button></section>
<section id="panel" class="card hidden"><button id="recargar" class="blue">Recargar pendientes</button><button id="logout">Cerrar sesión</button><div id="lista"></div></section>
<section class="card"><h2>Diagnóstico</h2><pre id="log">Inicializando…</pre></section>
</main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,doc,getDoc,getDocs,collection,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDsgYJ3OGJ2JQfXX9l2CO-V26-v90sKFAY",authDomain:"cancionerodominico.firebaseapp.com",projectId:"cancionerodominico",storageBucket:"cancionerodominico.firebasestorage.app",messagingSenderId:"1019835999965",appId:"1:1019835999965:web:4a30265a4d1cc69ba65d34"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let perfil=null;function log(t){$('log').textContent=t}
$('login').onclick=()=>signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value).catch(e=>log(e.code+': '+e.message));$('logout').onclick=()=>signOut(auth);$('recargar').onclick=()=>cargar();
onAuthStateChanged(auth,async u=>{perfil=null;if(!u){$('sesion').textContent='Inicia sesión como ADMINISTRADOR.';$('loginBox').classList.remove('hidden');$('panel').classList.add('hidden');return}try{const s=await getDoc(doc(db,'usuarios',u.uid)),p=s.data();if(!s.exists()||p.activo!==true||p.rol!=='ADMINISTRADOR')throw Error('Esta pantalla requiere rol ADMINISTRADOR');perfil={uid:u.uid,nombre:p.nombre||'',email:u.email};$('sesion').textContent=`✓ ${perfil.nombre||perfil.email} · ADMINISTRADOR`;$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await cargar()}catch(e){log('ERROR: '+e.message);$('panel').classList.add('hidden')}});
async function cargar(){if(!perfil)return;log('Leyendo propuestas pendientes…');try{const s=await getDocs(collection(db,'canciones'));const rows=s.docs.filter(x=>x.data().estado==='PENDIENTE');$('lista').innerHTML=rows.length?rows.map(x=>{const d=x.data(),id=x.id;return `<div class="item"><b>${esc(d.titulo||'Sin título')}</b><div class="muted">${esc(d.autor||'')} · ${esc((d.momentos||[]).join(', '))}</div><p>Propuesto por: ${esc(d.creadoPorNombre||d.creadoPorEmail||d.creadoPor||'')}</p><label>Título<input id="t_${id}" value="${attr(d.titulo||'')}"></label><label>Autor<input id="a_${id}" value="${attr(d.autor||'')}"></label><label>Letra<textarea id="l_${id}">${esc(d.letra||'')}</textarea></label><button class="ok" onclick="aprobar('${id}')">✓ Aprobar</button><button class="bad" onclick="rechazar('${id}')">✗ Rechazar</button></div>`}).join(''):'<p>✓ No hay propuestas pendientes.</p>';log(`Pendientes encontradas: ${rows.length}`)}catch(e){log((e.code||'ERROR')+': '+e.message)}}
window.aprobar=async id=>{try{await updateDoc(doc(db,'canciones',id),{titulo:$('t_'+id).value.trim(),autor:$('a_'+id).value.trim(),letra:$('l_'+id).value.trim(),estado:'PUBLICADA',activo:true,revisadoPor:perfil.uid,revisadoAt:serverTimestamp(),actualizadoAt:serverTimestamp()});log('✓ Propuesta aprobada: '+id);await cargar()}catch(e){log((e.code||'ERROR')+': '+e.message)}};
window.rechazar=async id=>{try{await updateDoc(doc(db,'canciones',id),{estado:'RECHAZADA',activo:false,revisadoPor:perfil.uid,revisadoAt:serverTimestamp(),actualizadoAt:serverTimestamp()});log('✓ Propuesta rechazada: '+id);await cargar()}catch(e){log((e.code||'ERROR')+': '+e.message)}};
function esc(v){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function attr(v){return esc(v).replace(/"/g,'&quot;')}
</script></body></html>
